# 一键起前后端：docker compose up -d --build
#
# 架构：nginx（前端静态 + /api 反代） → backend（FastAPI，单进程）
# 只有前端端口对外暴露，后端留在 compose 内网里 —— 少一个对外入口，也免了 CORS。
#
# ⚠️ 凭据不在这个文件里：全部走根目录 .env（compose 的 env_file）。
#    .env 已被 .gitignore 忽略，克隆到服务器后需要手动创建 —— 见 docs/DEPLOY.md。

services:
  backend:
    build:
      context: ./backend
    image: sip-backend:latest
    container_name: sip-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内固定监听 0.0.0.0:8000；app_env 影响部分行为（如错误详情透出）
      APP_ENV: production
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
      # 前端与后端同源（都从 nginx 进），CORS 白名单给同源地址即可
      FRONTEND_ORIGIN: http://localhost
    volumes:
      # ⚠️ 数据必须落卷：角色 / 会话 / 上传的资料都在这里，
      # 不挂的话 `docker compose up --build` 重建容器就全没了。
      - ./backend/app/data:/app/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - sip

  frontend:
    build:
      context: ./frontend
    image: sip-frontend:latest
    container_name: sip-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 内网自用：把 80 换掉避免和宿主机上其它服务打架；需要外部访问就改成 "0.0.0.0:8080:80"
      # 只给本机/局域网访问时保持 127.0.0.1，或改成局域网 IP
      - "8080:80"
    networks:
      - sip

networks:
  sip:
    driver: bridge
