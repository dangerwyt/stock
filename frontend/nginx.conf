# 生产环境站点配置（容器内 nginx）。
# 与本地开发的差别：dev 时是 vite 的 proxy 把 /api 转给 8000，
# 生产没有 vite dev server —— 这里由 nginx 接管同一件事，前端因此仍是**同源**请求，
# 不需要额外配 CORS，也不用把后端端口暴露出去。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传的资料可能到 5MB（MAX_UPLOAD_MB 的默认值），留一倍余量
    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源（文件名带 hash，可长期缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 回退：vue-router 的 history 模式，
    # 直接访问 /top50 这类路径要还给 index.html，否则 nginx 会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代。⚠️ 保留 /api 前缀 —— 后端路由就是挂在 /api 下的（见 main.py 的 include_router）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # 覆盖 Host，后端按需拼绝对地址时不会拿到前端域名
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ AI 会诊/提炼是长请求（LLM 最长 120s，会诊多人更久），
        # 默认 60s 会把还在跑的流式响应切断。这里给到 10 分钟。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;          # NDJSON 流式帧必须实时透传，不能攒在缓冲里
        proxy_cache off;
    }
}
